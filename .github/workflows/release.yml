name: Release

# Собирает Windows-сборку и публикует GitHub Release при пуше тега vX.Y.Z.
# Лаунчер NIMVORO скачивает из релиза архив SaveUrls-win-x64.zip (имя задано в nimvoro.json).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Версия совпадает с тегом
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          "VERSION=$v" >> $env:GITHUB_ENV
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") {
            throw "Тег ${{ github.ref_name }} не совпадает с версией $v"
          }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Тесты
        run: cargo test --release

      - name: Сборка
        run: cargo build --release

      - name: Архив
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item target/release/SaveUrls.exe pkg/
          Compress-Archive -Path pkg/* -DestinationPath SaveUrls-win-x64.zip -Force

      - name: Публикация релиза
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v') { $tag = "v$env:VERSION" }
          gh release create $tag "SaveUrls-win-x64.zip" --title "Save URLs $tag" --generate-notes --verify-tag
